<!DOCTYPE html>
<html>
<head>
   <title> Sign Up Page </title>
</head>

<body>
    <h1> Sign Up </h1>
    <form id="signupForm" action="welcome.html">
        First Name:<input type="text" name="fName"><br>
        Last Name: <input type="text" name="lName"><br>
        Gender:    
            <input type="radio" name="gender" value="m">Male
            <input type="radio" name="gender" value="f">Female<br>
        Zip Code:  <input type="text" id="zip" name="zip"><span id="zipError"></span><br>
        City:   <span id="city"></span> <br>
        Latitude:  <span id="latitude"></span><br>
        Longitude: <span id="longitude"></span><br><br>

        State: <select id="state" name="state"></select> <br>


        Select a County: <select name="county" id="county"></select><br>
        Desired Username: <input type="text" name="username" id="username" ><span id="usernameValidation"></span><br><br>

        Password: <input name="pwd" id="pwd" type="password"><span id="suggestedPwd"></span> <br>
        Type Password Again: <input id="pwdConfirm" type="password"><br>
        <span id="passwordError"></span> 

        <input type="submit" value="Sign up!">
    </form>

    <script src="js/script.js"></script>

    </body>
</html>
