<!DOCTYPE html>
<html>
    <head>
        <title> Guess a Number </title>
        <meta charset="utf-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header>
            <img src="img/page_title.png" alt="Guess a Number Logo" id="page-title">
        </header>
        <br>
        <div class="content-wrapper">
            <div class="content">
                <div id="instructions">Guess a number between 1 and 99 in seven tries or less!</div>
                <div id="game-area">
                    <input type="text" id="playerGuess" size="10">
                    <div id="button-container">  
                        <button id="guessBtn" size="10"> Guess </button>
                        <button id="resetBtn" size="10"> Reset </button>
                    </div>
                </div>              
                <div id="feedback"></div>
                <div id="previousGuesses"> </div>
                <div id="remainingGuesses"> </div>
                <div id="results">
                    <span id="wins"></span>
                    <span id="losses"></span>
                </div>
            </div>
        </div>
        <footer>
        <div class="footer-content">
            <figure>
                <img src="img/otter.png" alt="CST Logo" width="75" height="75">
            </figure>
            <div>
                CST336 - Internet Programming. 2025&copy; Rosenfeld <br>
                <strong>Disclaimer:</strong> This website was made as an assignment for academic purposes only, it is not intended to be taken seriously.
            </div>
        </div>
    </footer>
        <script src="js/script.js"></script>
    </body>
</html>
